name: Unit tests

on:
  push:
    paths:
      - 'visual-studio-2015-mcp/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'visual-studio-2015-mcp/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:
    inputs:
      vs2015:
        description: Run the IDE cache regression on a dedicated VS2015 Windows runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: visual-studio-2015-mcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: visual-studio-2015-mcp/package-lock.json
      - run: npm ci
      - if: runner.os != 'Windows'
        run: npm test
      # Legacy PowerShell fixtures start separate x86 hosts and Framework compilers.
      - if: runner.os == 'Windows'
        run: node --test --test-concurrency=2 test/*.test.mjs
  ide-cache:
    if: github.event_name == 'workflow_dispatch' && inputs.vs2015 && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Windows, vs2015]
    timeout-minutes: 10
    env:
      VS2015_TEST_IDE_CACHE: '1'
    defaults:
      run:
        working-directory: visual-studio-2015-mcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: visual-studio-2015-mcp/package-lock.json
      - run: npm ci
      - run: node --test test/integration/ide-cache.test.mjs
