name: Unit tests

on:
  push:
    paths:
      - 'visual-studio-2015-mcp/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'visual-studio-2015-mcp/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: visual-studio-2015-mcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: visual-studio-2015-mcp/package-lock.json
      - run: npm ci
      - run: npm test
